name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Bicep
        run: az bicep install
      - name: Build templates and parameters
        run: |
          az bicep build --file azure/main.bicep --stdout > /dev/null
          az bicep build-params --file azure/parameters/prod.bicepparam --stdout > /dev/null

  local-tooling:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          bash -n azure/scripts/deploy.sh
          sh -n plx
          sh -n local/images/static-site/rewrite-origins.sh
